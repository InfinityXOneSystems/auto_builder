apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omni-gateway
  template:
    metadata:
      labels:
        app: omni-gateway
    spec:
      containers:
      - name: omni-gateway
        image: mcp/omni-gateway:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
